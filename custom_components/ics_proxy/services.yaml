session_command:
  name: Control charging session
  description: Start charging or stop an exact open session and wait for the local proxy to confirm the result.
  fields:
    action:
      name: Action
      required: true
      selector:
        select:
          options:
            - start
            - stop_session
    target:
      name: Stop target
      description: The stop_target attribute from the Session open sensor at the time of the request.
      selector:
        text:
    revision:
      name: Start control revision
      description: The control_revision from the Session open sensor when Start was shown. Required with a canvas render epoch.
      selector:
        number:
          min: 0
          max: 9007199254740991
          mode: box
    canvas_rendered_at_epoch:
      name: Canvas render epoch
      description: Optional whole-second Unix timestamp encoded in the image displayed when the button was pressed.
      selector:
        number:
          min: 1
          max: 4294967295
          mode: box
    include_request_reference:
      name: Include request reference
      description: Return a redacted reference for the attempted request. Use it to look up a local Stop incident.
      selector:
        boolean:
